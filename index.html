<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BD Operator Checker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1 id="app-title">BD Operator Checker</h1>
    <p id="tagline" class="tagline">Which operator does a Bangladeshi mobile number belong to?</p>
  </div>
  <button id="lang-btn" class="lang-btn">&#x09ac;&#x09be;&#x0982;&#x09b2;&#x09be;</button>
</header>
<nav class="tabs" aria-label="Sections">
  <button class="tab-btn active" data-tab="check">Check a number</button>
  <button class="tab-btn" data-tab="table">Prefix table</button>
  <button class="tab-btn" data-tab="batch">Batch check</button>
  <button class="tab-btn" data-tab="history">Recent</button>
</nav>
<main>
  <section id="panel-check" class="panel">
    <label id="number-label" for="number-input">Mobile number</label>
    <div class="row">
      <input id="number-input" type="tel" inputmode="tel" autocomplete="off" placeholder="e.g. 01712345678 or +8801712345678">
      <button id="check-btn" class="primary">Check</button>
      <button id="clear-btn">Clear</button>
    </div>
    <div id="result"></div>
    <div id="formats"></div>
  </section>

  <section id="panel-table" class="panel hidden">
    <h2 id="table-title">All mobile prefixes</h2>
    <p id="table-sub" class="muted">Tap an operator chip to filter.</p>
    <div class="chips">
      <button id="filter-all" class="filter-chip active" data-op="All">All</button>
      <button class="filter-chip" data-op="Grameenphone">Grameenphone</button>
      <button class="filter-chip" data-op="Robi">Robi</button>
      <button class="filter-chip" data-op="Banglalink">Banglalink</button>
      <button class="filter-chip" data-op="Teletalk">Teletalk</button>
    </div>
    <input id="table-search" type="search" placeholder="Search prefix or operator...">
    <p class="muted"><span id="table-count">10</span> rows</p>
    <table>
      <thead><tr><th id="th-prefix">Prefix</th><th id="th-operator">Operator</th><th id="th-brand">Brand / note</th></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
  </section>

  <section id="panel-batch" class="panel hidden">
    <label id="batch-label" for="batch-input">Paste numbers</label>
    <textarea id="batch-input" rows="6" placeholder="01712345678&#10;01887654321&#10;+8801912345678"></textarea>
    <button id="batch-btn" class="primary">Check all</button>
    <p id="batch-summary" class="muted"></p>
    <table>
      <thead><tr><th id="th-bnum">Number</th><th id="th-bresult">Result</th></tr></thead>
      <tbody id="batch-body"><tr><td colspan="2" class="empty">No numbers checked yet.</td></tr></tbody>
    </table>
  </section>

  <section id="panel-history" class="panel hidden">
    <h2 id="hist-title">Recent checks</h2>
    <button id="hist-clear">Clear history</button>
    <div id="hist-body"></div>
  </section>
</main>
<footer id="footer">Offline tool. Prefix = original allocation only (MNP may differ).</footer>
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
